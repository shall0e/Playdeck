<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/player-ui.css?v=player-updates-1"><title>Playdeck</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0b;color:#eee;font:15px system-ui,sans-serif}iframe{width:100vw;height:100vh;border:0;display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:#0b0c0b}#loading[hidden],#panel[hidden]{display:none}h1{font-size:24px;margin-bottom:10px}p{color:#aaa;max-width:470px;line-height:1.5}button{font:inherit;border:1px solid #555;border-radius:10px;background:#202320;color:#eee;padding:9px 14px;cursor:pointer}button:hover{background:#333}#badge{position:fixed;bottom:12px;right:12px;opacity:.7;font-size:12px}#badge:hover{opacity:1}#panel{position:fixed;right:12px;bottom:58px;max-width:340px;padding:20px;border:1px solid #444;background:#121512;border-radius:14px;box-shadow:0 12px 35px #0008}#panel p{font-size:13px}#error{color:#ffae94}#fallback{margin-top:15px}
#loading{background:radial-gradient(ellipse at 50% 35%,#23271c 0,transparent 65%),#0b0c0b;justify-items:center}#loading h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.7px;margin:20px 0 0}#loading p{margin:12px 0 18px;font-size:14px}#loading button{margin:6px}#loading [hidden]{display:none!important}.eyebrow{font-size:10px;letter-spacing:2px;color:#92988b;margin-top:24px}.loader-mark{width:46px;height:46px;border:2px solid #ffffff12;border-top-color:#d7ff64;border-radius:50%;animation:loading-spin 1s linear infinite}#continue{background:#d7ff64;color:#171b0f;border-color:#d7ff64}#fallback{background:transparent;border-color:#ffffff20;color:#a5a99f;font-size:13px}@keyframes loading-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loader-mark{animation-duration:3s}}
#badge{z-index:10;opacity:1;border:0;outline:0;background:rgba(25,28,25,.58);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 18px #0003;color:#e0e4dc;padding:9px 13px;border-radius:10px;transition:background .18s}#badge:hover,#badge:focus-visible{background:rgba(45,49,43,.72);outline:0}#panel{z-index:11}
#panel{border:0;background:rgba(25,28,25,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 30px #0004;color:#e0e4dc}#panel p{color:#bdc3b9}#panel button{border:0;outline:0;background:rgba(110,120,106,.19);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;color:#e0e4dc}#panel button:hover,#panel button:focus-visible{background:rgba(140,150,136,.3)}#panel button:disabled{opacity:.45;cursor:default}
</style><script type="module" src="boot.js?v=player-updates-1"></script></head><body>
<div id="loading"><span class="loader-mark" aria-hidden="true"></span><h1 id="name">Importing game</h1><p id="status" role="status">Preparing local sandbox…</p><p id="error" hidden></p><button id="retry" type="button" hidden>Import again</button><button id="continue" type="button" hidden>Show game</button></div>
<button id="badge" type="button" aria-expanded="false" aria-controls="panel">Settings</button>
<section id="panel" hidden><div class="download-row"><span id="files">Checking files…</span><button id="clear-game" type="button" disabled title="Clear this game’s cached downloads; keep saves">Clear game</button></div><p id="storage-note" hidden>Files are saved as they load. A downloaded file can run offline; online features and missing files still need internet. Game saves stay managed by the game.</p><button id="clear" type="button">Clear all downloaded files</button></section>
</body></html>
