name: Deploy standalone Playdeck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playdeck-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate player
        run: |
          node --check website/_worker.js
          node --check website/player/boot.js
          npm test
      - name: Build player and public downloads
        run: npm run build
      - name: Create or select independent Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAYER_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'playdeck' }}
          PLAYER_HOST: ${{ vars.PLAYDECK_HOST || 'playdeck-1z1.pages.dev' }}
        run: node scripts/pages-project.mjs
      - name: Deploy player
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.92.0
          command: pages deploy dist --project-name ${{ env.PAGES_PROJECT }} --branch ${{ env.PAGES_PRODUCTION_BRANCH }}
      - name: Verify deployed Playdeck toolbar in Chromium
        env:
          PLAYDECK_URL: ${{ env.PAGES_URL }}
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          node scripts/verify-live-toolbar.mjs
      - name: Save deployed toolbar screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playdeck-toolbar
          path: playdeck-toolbar.png
          if-no-files-found: ignore
